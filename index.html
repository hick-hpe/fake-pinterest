<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Fake Pinterest - Criar Pin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="assets/styles.css">
</head>

<body>

    <div class="pagina d-flex">

        <!-- Conteúdo principal -->
        <main class="conteudo-principal flex-grow-1">

            <!-- Cabeçalho -->
            <nav id="cabecalho" class="navbar border-bottom px-3">
                <div class="container-fluid">
                    <span class="navbar-brand mb-0 h1">
                        Criar Pin
                    </span>
                </div>
            </nav>

            <div id="progresso-mobile" class="d-none p-3 mb-3">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <div class="spinner-border spinner-border-sm text-danger" role="status">
                        <span class="visually-hidden">Publicando...</span>
                    </div>

                    <span id="texto-progresso-mobile" class="fw-semibold">
                        Publicando Pin...
                    </span>
                </div>

                <div class="progress" style="height: 6px;">
                    <div id="barra-progresso-mobile"
                        class="progress-bar progress-bar-striped progress-bar-animated bg-danger" style="width: 0%"
                        role="progressbar" aria-label="Progresso da publicação" aria-valuemin="0" aria-valuemax="100"
                        aria-valuenow="0">
                    </div>
                </div>

                <small id="porcentagem-mobile" class="text-muted">0%</small>
            </div>

            <!-- Formulário -->
            <form id="formulario-pin" class="formulario row g-0 p-3">

                <!-- Área de upload -->
                <div class="col-12 col-lg-5 upload-coluna p-2">


                    <label for="arquivos"
                        class="area-upload border rounded-3 p-3 d-flex flex-column text-center justify-content-between">

                        <div class="my-auto">

                            <!-- Estado inicial -->
                            <div id="upload-vazio">
                                <i class="bi bi-image fs-1" aria-hidden="true"></i>

                                <div class="fw-bold mt-2">
                                    Envie seus arquivos de mídia
                                </div>

                                <div class="text-muted mt-1">
                                    Selecione uma imagem do seu dispositivo.
                                </div>

                                <div class="mt-3">
                                    <span class="btn btn-dark">
                                        Selecionar arquivo
                                    </span>
                                </div>
                            </div>

                            <!-- Prévia da imagem selecionada -->
                            <div id="upload-preview" class="d-none">
                                <img id="imagem-upload" src="" alt="Prévia do Pin" class="img-fluid rounded-3">

                                <div class="fw-bold mt-2">
                                    Imagem carregada!
                                </div>

                                <div class="text-muted small mt-1">
                                    Selecione outra imagem para substituí-la.
                                </div>
                            </div>

                            <!-- Mensagem de erro -->
                            <div id="upload-erro" class="d-none" role="alert" aria-live="polite">

                                <i class="bi bi-exclamation-circle fs-1" aria-hidden="true"></i>

                                <div id="mensagem-erro" class="fw-bold mt-2"></div>
                            </div>

                            <!-- Campo de seleção de arquivo -->
                            <input type="file" id="arquivos" name="arquivos" class="visually-hidden"
                                accept="image/jpeg,image/png,image/webp">

                        </div>

                        <!-- Limites do arquivo: permanecem visíveis em todos os estados -->
                        <small class="text-muted mt-3">
                            JPG, PNG e WebP até 20 MB · Dimensões mínimas: 200 × 300 px
                        </small>

                    </label>

                </div>

                <!-- Demais campos -->
                <div class="col-12 col-lg-7 campos-coluna p-2">

                    <!-- Título -->
                    <div class="mb-3 p-2 bg-cinza rounded-4 div-input">
                        <label for="titulo" class="form-label ms-2">
                            Título
                        </label>

                        <input type="text" class="form-control" id="titulo" name="titulo"
                            placeholder="Título do seu Pin" disabled value="Livro TEMPO">
                    </div>

                    <!-- Descrição -->
                    <div class="mb-3 p-2 bg-cinza rounded-4 div-input">
                        <label for="descricao" class="form-label ms-2">
                            Descrição
                        </label>

                        <textarea class="form-control" id="descricao" name="descricao"
                            placeholder="Descrição do seu Pin" rows="4" disabled>Descrição do livro "TEMPO"</textarea>
                    </div>

                    <!-- Link -->
                    <div class="mb-3 p-2 bg-cinza rounded-4 div-input">
                        <label for="link" class="form-label ms-2">
                            Ligação
                        </label>

                        <input type="url" class="form-control" id="link" name="link"
                            placeholder="Link do produto (opcional)" disabled
                            value="https://br.pinterest.com/pin/825706912958532887/">
                    </div>

                    <!-- Tópicos -->
                    <div class="mb-3 p-2 bg-cinza rounded-4 div-input">
                        <label for="topicos" class="form-label ms-2">
                            Tópicos etiquetados
                        </label>

                        <input type="text" class="form-control" id="topicos" name="topicos"
                            placeholder="Tópicos do produto (opcional)" disabled value="#livros #tempo">
                    </div>

                    <!-- Ações -->
                    <div class="d-flex justify-content-end gap-2">
                        <button type="reset" class="btn btn-outline-secondary">
                            Limpar todos os campos
                        </button>

                        <button type="submit" class="btn btn-danger">
                            Publicar Pin
                        </button>
                    </div>

                </div>
            </form>

            <!-- Prévia do Pin publicado -->
            <section id="pin-publicado" class="d-none p-3">

                <button type="button" id="voltar-formulario" class="btn btn-outline-secondary mb-3">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                    Volta à tela de criação
                </button>

                <h2 class="h4 mb-4">Pin publicado</h2>

                <div class="card pin-publicado-card">
                    <div class="row g-0">
                        <!-- Imagem à esquerda -->
                        <div class="col-md-6 pin-imagem-container">
                            <a id="pin-link" href="#" target="_blank" rel="noopener noreferrer"
                                class="d-none pin-publicado-link">
                                <img id="pin-imagem" src="" alt="" class="pin-publicado-imagem">
                            </a>

                            <img id="pin-imagem-sem-link" src="" alt="" class="pin-publicado-imagem d-none">
                        </div>

                        <!-- Informações à direita -->
                        <div class="col-md-6">
                            <div class="card-body p-4">
                                <h3 id="pin-titulo" class="h4 mb-3"></h3>

                                <p id="pin-descricao" class="card-text mb-4"></p>

                                <p id="pin-topicos" class="text-muted small mb-0"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

        </main>

        <!-- Aba de rascunhos -->
        <aside id="aba-rascunhos" class="aba-rascunhos border-start flex-shrink-0">

            <!-- Conteúdo para telas médias ou maiores -->
            <div class="rascunhos-desktop">

                <div class="border-bottom p-3">
                    <!-- Removido o mb-3 para centralizar o título perfeitamente no espaço -->
                    <div class="d-flex align-items-center justify-content-between gap-2">
                        <span class="fw-semibold">
                            Rascunhos de Pin
                        </span>

                        <i class="bi bi-journal-text fs-5" aria-hidden="true"></i>
                    </div>
                </div>

                <div class="lista-rascunhos p-3">

                    <!-- Mensagem exibida quando não há imagem -->
                    <div id="rascunho-placeholder" class="rascunho-placeholder rounded-3 p-3 text-center">
                        <i class="bi bi-image fs-2" aria-hidden="true"></i>

                        <p class="mb-0 mt-2 text-muted">
                            Seus rascunhos aparecerão aqui.
                        </p>
                    </div>

                    <!-- Rascunho da imagem carregada -->

                    <div id="rascunho-card" class="d-none bg-cinza rounded-3 p-2">

                        <div class="d-flex gap-2 align-items-center">

                            <!-- Imagem com ícone sobreposto -->
                            <div class="imagem-rascunho-container position-relative flex-shrink-0">
                                <img id="imagem-rascunho" src="" alt="Prévia do rascunho"
                                    class="rounded-2 imagem-rascunho">

                                <!-- Ícone de carregamento -->
                                <div id="icone-publicando" class="status-imagem d-none">
                                    <div class="spinner-border text-light" role="status">
                                        <span class="visually-hidden">Publicando...</span>
                                    </div>
                                </div>

                                <!-- Ícone de publicação concluída -->
                                <div id="icone-publicado" class="status-imagem status-sucesso d-none">
                                    <i class="bi bi-check-lg" aria-hidden="true"></i>
                                </div>
                            </div>

                            <!-- Texto e progresso ao lado da imagem -->
                            <div class="flex-grow-1 min-width-0">

                                <div id="texto-rascunho">
                                    <div class="fw-semibold">Imagem carregada!</div>
                                    <small class="text-muted">Rascunho de Pin</small>
                                </div>

                                <div id="progresso-publicacao" class="d-none">

                                    <div id="estado-publicando">
                                        <div class="small fw-semibold mb-1">Publicando...</div>

                                        <div class="progress" style="height: 6px;" role="progressbar"
                                            aria-label="Progresso da publicação" aria-valuemin="0" aria-valuemax="100"
                                            aria-valuenow="0" id="barra-progresso-container">
                                            <div id="barra-progresso"
                                                class="progress-bar progress-bar-striped progress-bar-animated bg-danger"
                                                style="width: 0%">
                                            </div>
                                        </div>

                                        <small id="porcentagem-publicacao" class="text-muted">0%</small>
                                    </div>

                                    <div id="estado-publicado" class="d-none">
                                        <div class="small fw-semibold text-success">
                                            Pin publicado!
                                        </div>
                                    </div>

                                </div>
                            </div>

                            <!-- Botão de opções -->
                            <button type="button" id="excluir-rascunho" class="btn btn-sm btn-light align-self-start"
                                aria-label="Excluir imagem" title="Excluir imagem">
                                <i class="bi bi-three-dots-vertical" aria-hidden="true"></i>
                            </button>

                        </div>
                    </div>

                </div>

            </div>

            <!-- Ícone para telas pequenas -->
            <div class="rascunhos-mobile">
                <div class="d-flex justify-content-center pt-4">
                    <i class="bi bi-folder fs-3" aria-hidden="true"></i>
                </div>
            </div>

        </aside>
    </div>


    <div id="carregando-pin" class="carregando-pin d-none">
        <div class="spinner-border text-danger" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>

        <span class="fw-semibold">Preparando seu Pin...</span>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="assets/scripts.js"></script>

</body>

</html>
